<!--
Program: index.html
Author: Felix Baum
Last Updated: 8/21/24
Description: Formats the appearance, logic, and finer details of the PestyHunter ADS-B map. 
Notes: Tracks depicted in green were correctly classified by PestyHunter.
-------------------------------------------------------------------------
CRITICAL NOTE: Users must replace the clientID declared in line 40 with their own!
Cont: To access OpenAIP data, create an account at https://www.openaip.net/auth/register
Cont: and add an API Client at https://www.openaip.net/user/api-clients
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesty Hunter ADS-B Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #map { 
        height: 99vh;
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/node_modules/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>
</head>
<body>
    <div id="map"></div>
    <script>
        //priority layers via leaflet layercontrol
        let priorityLayers = {
            0: L.layerGroup(),
            1: L.layerGroup(),
            2: L.layerGroup(),
            3: L.layerGroup()
        };
        //instantiating map
        let map = L.map('map').setView([39.226851, -76.815225], 10);

        //IMPORTANT! Enter your OpenAIP clientID below to gain access to OpenAIP VFRmap data
        var clientId  = '';


        var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 25,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        var basicMap = L.tileLayer(
                'https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg', {
                    attribution: 'Map tiles by <a href="http://stamen.com">' +
                        'Stamen Design</a>, under' +
                        '<a href="http://creativecommons.org/licenses/by/3.0">' +
                        'CC BY 3.0</a>.',
                    maxZoom:25
            }).addTo(map);
        var openAipLayer = L.tileLayer('https://api.tiles.openaip.net/api/data/openaip/{z}/{x}/{y}.png?apiKey=' + clientId, {
            maxZoom: 14,
            tileSize: 256,
            attribution: '<a href="https://www.openaip.net">© OpenAIP</a>'
        });

        var baseMaps = {
            "OpenStreetMap": osm,
            "Stamen": basicMap
        }

        Object.values(priorityLayers).forEach(layer => layer.addTo(map));
        let layerControl = L.control.layers(baseMaps, {
            "Priority 0": priorityLayers[0],
            "Priority 1": priorityLayers[1],
            "Priority 2": priorityLayers[2],
            "Priority 3": priorityLayers[3],
            "openAIP": openAipLayer
        }, {collapsed: false}).addTo(map);
        //creating markers w/ custom options
        let markers = {};
        var trackIconCMtrue = L.Icon.extend({
            options: {
                iconUrl: "/static/CMtrue.png",
                iconSize:  [15,23],
                rotationOrigin: 'center',
                shadowUrl: null
                //used if ai_class==priority (PestyHunter correctly identified track's class)
            }
        })
        var trackIconCMfalse = L.Icon.extend({
            options: {
                iconUrl: "/static/CMfalse.png",
                iconSize: [15,23],
                rotationOrigin:'center',
                shadowUrl: null
                //used if ai_class!=priority (PestyHunter incorrectly indentified track's class)
            }
        })

        function updateMap() {
            Object.values(priorityLayers).forEach(layer => layer.clearLayers());
            let bounds = map.getBounds();
            //get newest tracks within map bounds
            //calls app.py which calls database.py which gets the most recent data from pestyhunter.db (which is being updated by updater.py)
            let url = `/api/latest_tracks?min_lat=${bounds.getSouth()}&max_lat=${bounds.getNorth()}&min_lon=${bounds.getWest()}&max_lon=${bounds.getEast()}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log('Received tracks:', data.tracks);
                    const tracks=data.tracks;
                    //logic for keeping data fresh
                    let currentTime = Math.floor(Date.now() /1000);
                    let fiveMinutesAgo = currentTime-300;

                    // Group tracks by ICAO24 and keep only the most recent entry
                    let latestTracks = tracks.reduce((acc, track) => {
                        if (!acc[track.icao24] || acc[track.icao24].timestamp < track.timestamp) {
                            acc[track.icao24] = track;
                        }
                        return acc;
                    }, {});
                    
                    Object.values(latestTracks).forEach(track => {
                        //logic for adding heading to leaflet icons
                        if(track.heading != null){
                            var markerHeading = track.heading;
                        }
                        else{
                            var markerHeading=0;
                        }

                        if(track.ai_class==track.priority){
                            var classMatchup = true;
                        }
                        else{
                            var classMatchup = [track.ai_class, track.priority];
                            //if PestyHunter classified incorrectly, both values will be shown.
                        } 
                        let id = track.icao24;
                        let latLng = [track.latitude, track.longitude];
                        let popup = `ICAO24: ${id}<br>Class Matchup: ${classMatchup}<br>Heading: ${track.heading}<br>Callsign: ${track.callsign}<br>Altitude: ${track.altitude}<br>Velocity: ${track.velocity}<br>Timestamp: ${new Date(track.timestamp * 1000).toLocaleString()}`;
                        //popup contains plenty of info about each track!
                        if(track.timestamp >=fiveMinutesAgo) {
                            if (!markers[id]) {
                                console.log('Adding new marker:', id);
                                if (classMatchup==true){
                                    markers[id] = L.marker(latLng, {
                                        icon: new trackIconCMtrue(),
                                        rotationAngle: markerHeading
                                    }).addTo(map).bindPopup(popup);

                                }
                                else{
                                    markers[id] = L.marker(latLng, {
                                        icon: new trackIconCMfalse(),
                                        rotationAngle: markerHeading
                                    }).addTo(map).bindPopup(popup);
                                }
                            } else {
                                console.log('Updating marker:', id);
                                markers[id].setRotationAngle(markerHeading);
                                markers[id].setLatLng(latLng).setPopupContent(popup);
                            }
                            Object.values(priorityLayers).forEach(layer => layer.removeLayer(markers[id]));
                            priorityLayers[track.priority].addLayer(markers[id]);
                        }

                    });

                    Object.keys(markers).forEach(id => {
                        if (!latestTracks[id] || latestTracks[id].timestamp < fiveMinutesAgo) {
                            console.log('Removing marker:', id);
                            Object.values(priorityLayers).forEach(layer => layer.removeLayer(markers[id]));
                            delete markers[id];
                            //removing old markers (5 mins)
                        }
                    });
                })
        
                .catch(error => console.error('Error fetching tracks:', error));
        }
        map.on('moveend', updateMap);
        updateMap();
        setInterval(updateMap, 5000);
        //map updates every 5 seconds, as well as after the map is moved by a user
    </script>
</body>
</html>
